[package]
name = "apex-coach"
version = "0.1.0"
description = "Real-time Apex Legends coach with HUD OCR and Google Gemini"
authors = ["beasx34"]
edition = "2021"
license = "MIT"
repository = "https://github.com/beasx34/apex-coach"

[lib]
name = "apex_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "5"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[features]
# Default to no Windows-OCR backend at compile time when the host is not Windows.
# CI uses `--no-default-features` on non-Windows runners; the Windows binary
# uses the real Windows.Media.Ocr backend automatically via #[cfg(windows)].
default = []
