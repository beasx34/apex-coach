[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-coach"
version = "0.1.0"
description = "Real-time tactical coach overlay for Apex Legends. Screen-capture + OCR + Gemini Flash. Russian advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "apex-coach contributors" }]
keywords = ["apex-legends", "overlay", "ocr", "gemini", "coach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mss>=10.0,<11",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "rapidocr-onnxruntime>=1.3,<2",
    "PySide6>=6.6,<7",
    "pynput>=1.7,<2",
    "google-genai>=1.0,<3",
    "pydantic>=2.6,<3",
    "structlog>=24.1,<26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-Pillow",
]

[project.scripts]
apex-coach = "apex_coach.main:run"

[project.urls]
Homepage = "https://github.com/your-org/apex-coach"
Issues   = "https://github.com/your-org/apex-coach/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_coach*"]

[tool.setuptools.package-data]
apex_coach = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# RUF001/002/003 — ambiguous Cyrillic letters; we ship a Russian-language app.
# RUF046 — false-positive complaints about `int(round(...))` for explicit type.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
# 3rd-party libs without type stubs
[[tool.mypy.overrides]]
module = [
    "mss",
    "mss.*",
    "cv2",
    "rapidocr_onnxruntime",
    "rapidocr_onnxruntime.*",
    "pynput",
    "pynput.*",
    "google.genai",
    "google.genai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
